    function toggleSetting(key) {
      state.settings[key] = !state.settings[key];
      saveSettings();
      renderCurrentTab();
    }

    function setDefaultRest(sec) {
      state.settings.defaultRestSeconds = sec;
      saveSettings();
      renderCurrentTab();
      showToast(`Descanso predeterminado: ${sec}s`);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportBackupJSON() {
      const today = new Date().toISOString().slice(0, 10);
      const payload = {
        app: 'NeonLift',
        version: 1,
        exportedAt: new Date().toISOString(),
        routine: state.routine,
        history: state.history,
        settings: state.settings,
      };
      downloadFile(JSON.stringify(payload, null, 2), `gym_backup_${today}.json`, 'application/json');
      showToast('Backup JSON descargado');
    }

    function triggerImportJSON() {
      const input = document.getElementById('import-json-input');
      input.value = '';
      input.click();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed.routine) || !Array.isArray(parsed.history)) {
            showToast('El archivo JSON no tiene un formato válido de NeonLift.', 'error');
            return;
          }
          window.__pendingImport = parsed;
          openModal(`
            <div class="space-y-4">
              <h3 class="text-base font-extrabold text-textMain">¿Restaurar Backup?</h3>
              <p class="text-xs text-textMuted leading-relaxed">
                Se reemplazarán tu rutina actual y tu historial por el archivo seleccionado (<span class="text-textMain font-bold">${parsed.history.length} entrenamientos</span>).
              </p>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="closeModal()" class="h-12 rounded-xl bg-surfaceLight border border-borderSubtle text-xs font-bold text-textMain">Cancelar</button>
                <button type="button" onclick="applyPendingImport()" class="h-12 rounded-xl bg-neon text-white text-xs font-extrabold neon-glow-sm">Restaurar</button>
              </div>
            </div>
          `);
        } catch (err) {
          showToast('Error al leer el archivo JSON.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function applyPendingImport() {
      const data = window.__pendingImport;
      if (!data) return;
      state.routine = data.routine;
      state.history = data.history;
      if (data.settings) state.settings = { ...getDefaultSettings(), ...data.settings };
      state.draft.days = {};
      saveRoutine();
      saveHistory();
      saveSettings();
      saveDraft();
      delete window.__pendingImport;
      closeModal();
      renderCurrentTab();
      showToast('Backup restaurado correctamente');
    }

    // Exportación a Excel (.csv) con BOM UTF-8
    function exportHistoryCSV() {
      if (state.history.length === 0) {
        showToast('No hay historial para exportar todavía.', 'error');
        return;
      }

      const escCsv = (val) => {
        const s = String(val ?? '').replace(/"/g, '""');
        return `"${s}"`;
      };

      const rows = [['Fecha', 'Día', 'Ejercicio', 'Serie', 'Peso_kg', 'Reps', 'RIR', 'Nota']];

      const sorted = [...state.history].sort((a, b) => new Date(b.date) - new Date(a.date));
      sorted.forEach((sess) => {
        const dateStr = new Date(sess.date).toLocaleDateString('es-AR');
        (sess.exercises || []).forEach((ex) => {
          (ex.sets || []).forEach((st, idx) => {
            rows.push([
              dateStr,
              sess.dayName,
              ex.name,
              idx + 1,
              st.weight ?? '',
              st.reps ?? '',
              st.rir ?? '',
              idx === 0 ? ex.note || '' : '',
            ]);
          });
        });
      });

      const csvContent = '\uFEFF' + rows.map((r) => r.map(escCsv).join(',')).join('\r\n');
      const today = new Date().toISOString().slice(0, 10);
      downloadFile(csvContent, `gym_historial_${today}.csv`, 'text/csv;charset=utf-8;');
      showToast('Archivo Excel (.csv) descargado');
    }

    function confirmClearHistory() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-extrabold text-textMain">¿Borrar todo el historial?</h3>
          <p class="text-xs text-textMuted">Tu rutina de 4 días se mantendrá intacta, pero se borrarán todos los entrenamientos y gráficos registrados.</p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="closeModal()" class="h-12 rounded-xl bg-surfaceLight border border-borderSubtle text-xs font-bold text-textMain">Cancelar</button>
            <button type="button" onclick="executeClearHistory()" class="h-12 rounded-xl bg-red-600 text-white text-xs font-extrabold">Borrar historial</button>
          </div>
        </div>
      `);
    }

    function executeClearHistory() {
      state.history = [];
      state.progressSelectedPointIdx = null;
      saveHistory();
      closeModal();
      renderCurrentTab();
      showToast('Historial borrado');
    }

    // Confirmación doble para restablecer datos de fábrica
    function confirmFactoryResetStep1() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-extrabold text-red-400">Paso 1 de 2 · Restablecer app</h3>
          <p class="text-xs text-textMuted leading-relaxed">
            Esto eliminará tu rutina personalizada, borradores activos, ajustes y todo tu historial de entrenamientos. Te recomendamos exportar un backup (.json) antes.
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="closeModal()" class="h-12 rounded-xl bg-surfaceLight border border-borderSubtle text-xs font-bold text-textMain">Cancelar</button>
            <button type="button" onclick="confirmFactoryResetStep2()" class="h-12 rounded-xl bg-red-600/80 text-white text-xs font-extrabold">Continuar →</button>
          </div>
        </div>
      `);
    }

    function confirmFactoryResetStep2() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-extrabold text-red-400">Paso 2 de 2 · Confirmación final</h3>
          <p class="text-xs text-textMain font-semibold leading-relaxed">
            ¿Estás 100% seguro de borrar todos los datos y volver a la rutina Torso/Pierna original? Esta acción no se puede deshacer.
          </p>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="closeModal()" class="h-12 rounded-xl bg-surfaceLight border border-borderSubtle text-xs font-bold text-textMain">Cancelar</button>
            <button type="button" onclick="executeFactoryReset()" class="h-12 rounded-xl bg-red-600 text-white text-xs font-extrabold">Sí, borrar todo</button>
          </div>
        </div>
      `);
    }

    function executeFactoryReset() {
      Object.values(STORAGE_KEYS).forEach((k) => localStorage.removeItem(k));
      state.routine = getDefaultRoutine();
      state.history = [];
      state.settings = getDefaultSettings();
      state.draft = { selectedDayId: 1, days: {} };
      state.progressSelectedExercise = '';
      state.progressSelectedPointIdx = null;
      stopTimer();
      saveRoutine();
      saveHistory();
      saveSettings();
      saveDraft();
      closeModal();
      renderCurrentTab();
      showToast('Aplicación restablecida de fábrica');
    }

    /* -------------------------------------------------------------------------
       INICIALIZACIÓN
       ------------------------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', () => {
      loadFromStorage();

      // Botón superior para abrir el cronómetro manualmente
      document.getElementById('btn-open-timer').addEventListener('click', () => {
        if (state.timer.active) {
          stopTimer();
        } else {
          startRestTimer(state.settings.defaultRestSeconds || 90);
        }
      });

      // Listener para importar archivo JSON
      document.getElementById('import-json-input').addEventListener('change', handleImportFile);

      updateNavHighlight();
      renderCurrentTab();
    });
  </script>
